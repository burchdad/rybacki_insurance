name: Review checks

on:
  pull_request:
  push:
    branches:
      - review/oct13-client-checklist

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The inherited lockfile was resolved with legacy optional peer handling.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_PRODUCTION: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
